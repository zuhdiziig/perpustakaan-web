[phases.setup]
nixPkgs = [
    'php83',
    'php83Extensions.pdo_pgsql',
    'php83Extensions.pgsql',
    'php83Extensions.mbstring',
    'php83Extensions.openssl',
    'php83Extensions.tokenizer',
    'php83Extensions.xml',
    'php83Extensions.ctype',
    'php83Extensions.curl',
    'php83Extensions.gd',
    'nodejs_20',
    'npm-10_x'
]

[phases.build]
cmds = [
    'npm ci || npm install',
    'npm run build',
    'composer install --no-dev --optimize-autoloader'
]

[start]
cmd = 'php artisan config:clear && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT'
